# Сетевые драйверы Docker

# Сеть для проекта
networks:
  ecoved-network:
    driver: bridge

# Бэкенд: FastAPI
services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend/src:/app/src
    environment:
      - PORT=8000
    networks:
      - ecoved-network
    restart: unless-stopped

  # Фронтенд: Next.js
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    networks:
      - ecoved-network
    restart: unless-stopped
    depends_on:
      - backend
