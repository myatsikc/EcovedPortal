# Сеть для проекта
networks:
  ecoved-network:
    driver: bridge

services:
  # Бэкенд: FastAPI (порт 8000 — только внутренняя сеть)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    environment:
      - PORT=8000
    networks:
      - ecoved-network
    restart: unless-stopped

  # Фронтенд: Next.js (порт 3000 — наружу, проброшен роутером)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_URL: http://backend:8000
    ports:
      - "3000:3000"
    environment:
      - API_PROXY_URL=http://backend:8000
    networks:
      - ecoved-network
    restart: unless-stopped
    depends_on:
      - backend
